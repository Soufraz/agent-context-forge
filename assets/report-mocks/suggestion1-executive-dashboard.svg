<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="auto" style="max-width: 880px;">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b101d" />
    </linearGradient>
  </defs>

  <!-- Browser Container -->
  <rect x="0" y="0" width="880" height="500" rx="12" fill="url(#dashBg)" stroke="#1f2937" stroke-width="1.5" />

  <!-- Browser Window Top Header -->
  <rect x="0" y="0" width="880" height="38" rx="12" fill="#111827" />
  <circle cx="20" cy="19" r="5" fill="#ef4444" />
  <circle cx="36" cy="19" r="5" fill="#f59e0b" />
  <circle cx="52" cy="19" r="5" fill="#10b981" />
  <rect x="220" y="8" width="440" height="22" rx="4" fill="#030712" />
  <text x="440" y="23" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">.agent-context-report.html • Generated in 1.4s</text>

  <!-- Title & Meta Header -->
  <g transform="translate(30, 60)">
    <text x="0" y="20" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">🛠️ Context Health Audit Dashboard</text>
    <text x="0" y="40" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#64748b">Project: my-application • Stack: TypeScript / Node.js • Target: Claude Code</text>

    <rect x="690" y="5" width="130" height="24" rx="12" fill="#1e1b4b" stroke="#3730a3" stroke-width="1" />
    <text x="755" y="21" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle">CLAUDE CODE</text>
  </g>

  <!-- 3 Score Metric Cards -->
  <g transform="translate(30, 115)">
    <!-- Score Card -->
    <rect x="0" y="0" width="260" height="90" rx="8" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.2" />
    <text x="18" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">CONTEXT HEALTH SCORE</text>
    <text x="18" y="62" font-family="-apple-system, system-ui, sans-serif" font-size="34" font-weight="800" fill="#10b981">96<tspan font-size="16" fill="#64748b" font-weight="500"> / 100</tspan></text>
    <rect x="150" y="38" width="90" height="24" rx="4" fill="#064e3b" />
    <text x="195" y="54" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">GRADE A</text>
    <text x="18" y="80" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">Optimal Context Stability</text>

    <!-- Tier-1 Card -->
    <rect x="280" y="0" width="260" height="90" rx="8" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <text x="298" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">TIER-1 ROOT CONTEXT</text>
    <text x="298" y="62" font-family="-apple-system, system-ui, sans-serif" font-size="30" font-weight="800" fill="#38bdf8">48 lines</text>
    <text x="298" y="80" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#64748b">CLAUDE.md • ~1,100 tokens per turn</text>

    <!-- Lockfile Card -->
    <rect x="560" y="0" width="260" height="90" rx="8" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <text x="578" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">UNPROTECTED LOCKFILE EXPOSURE</text>
    <text x="578" y="62" font-family="-apple-system, system-ui, sans-serif" font-size="30" font-weight="800" fill="#10b981">None</text>
    <text x="578" y="80" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#64748b">Lockfiles guarded by permissions.deny</text>
  </g>

  <!-- 5 Pillar Rows -->
  <g transform="translate(30, 225)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="820" height="46" rx="6" fill="#090d16" stroke="#1f2937" stroke-width="1" />
    <rect x="0" y="0" width="4" height="46" rx="2" fill="#10b981" />
    <text x="18" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Pillar 1: Prefix Stability &amp; Immutability</text>
    <text x="18" y="38" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#94a3b8">CLAUDE.md (48 lines) • Zero volatile task markers • Pre-commit gate active</text>
    <rect x="730" y="11" width="76" height="24" rx="4" fill="#064e3b" />
    <text x="768" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">30/30 pts</text>

    <!-- Row 2 -->
    <rect x="0" y="52" width="820" height="46" rx="6" fill="#090d16" stroke="#1f2937" stroke-width="1" />
    <rect x="0" y="52" width="4" height="46" rx="2" fill="#10b981" />
    <text x="18" y="74" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Pillar 2: Progressive Disclosure via Native LSP</text>
    <text x="18" y="90" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#94a3b8">typescript-lsp plugin + server ready • permissions.deny blocks lockfiles &amp; build artifacts</text>
    <rect x="730" y="63" width="76" height="24" rx="4" fill="#064e3b" />
    <text x="768" y="79" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">20/20 pts</text>

    <!-- Row 3 -->
    <rect x="0" y="104" width="820" height="46" rx="6" fill="#090d16" stroke="#1f2937" stroke-width="1" />
    <rect x="0" y="104" width="4" height="46" rx="2" fill="#10b981" />
    <text x="18" y="126" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Pillar 3: Smart Observation Masking (RTK)</text>
    <text x="18" y="142" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#94a3b8">Transparent PreToolUse command rewriter active • Collapses passing test stdout</text>
    <rect x="730" y="115" width="76" height="24" rx="4" fill="#064e3b" />
    <text x="768" y="131" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">15/15 pts</text>

    <!-- Row 4 -->
    <rect x="0" y="156" width="820" height="46" rx="6" fill="#090d16" stroke="#1f2937" stroke-width="1" />
    <rect x="0" y="156" width="4" height="46" rx="2" fill="#10b981" />
    <text x="18" y="178" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Pillar 4: Subagent Context Isolation</text>
    <text x="18" y="194" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#94a3b8">10-call exploration threshold armed • Prevents runaway inline search dilution</text>
    <rect x="730" y="167" width="76" height="24" rx="4" fill="#064e3b" />
    <text x="768" y="183" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">20/20 pts</text>

    <!-- Row 5 -->
    <rect x="0" y="208" width="820" height="46" rx="6" fill="#090d16" stroke="#1f2937" stroke-width="1" />
    <rect x="0" y="208" width="4" height="46" rx="2" fill="#10b981" />
    <text x="18" y="230" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Pillar 5: Episodic Auto-Memory &amp; PreCompact</text>
    <text x="18" y="246" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#94a3b8">Auto-Memory verified (3 topics) • PreCompact handover hook prevents lossy amnesia</text>
    <rect x="730" y="219" width="76" height="24" rx="4" fill="#064e3b" />
    <text x="768" y="235" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">15/15 pts</text>
  </g>
</svg>
