<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="auto" style="max-width: 880px;">
  <defs>
    <linearGradient id="bgS3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="880" height="440" rx="12" fill="url(#bgS3)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Left: Terminal CLI Run -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="410" height="392" rx="10" fill="#030712" stroke="#1e293b" stroke-width="1.2" />
    
    <!-- Titlebar -->
    <rect x="0" y="0" width="410" height="34" rx="10" fill="#111827" />
    <circle cx="16" cy="17" r="4.5" fill="#ef4444" />
    <circle cx="30" cy="17" r="4.5" fill="#f59e0b" />
    <circle cx="44" cy="17" r="4.5" fill="#10b981" />
    <text x="205" y="22" font-family="ui-monospace, monospace" font-size="11" fill="#64748b" text-anchor="middle">terminal • zsh</text>

    <!-- Terminal Output -->
    <text x="18" y="65" font-family="ui-monospace, monospace" font-size="14" fill="#38bdf8" font-weight="700">$ npx agent-context-forge</text>
    <text x="18" y="95" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">┌   🛠️  AGENT CONTEXT FORGE v0.1.0</text>
    <text x="18" y="120" font-family="ui-monospace, monospace" font-size="11" fill="#10b981">◇  🔍 Existing project detected: [TypeScript]</text>
    <text x="18" y="145" font-family="ui-monospace, monospace" font-size="11" fill="#38bdf8">◆  Action: ⚡ Scan &amp; Generate Report</text>
    <text x="18" y="175" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">✔ Auditing codebase across 5 Pillars... (1.4s)</text>

    <!-- Score Summary Box in Terminal -->
    <rect x="18" y="200" width="374" height="110" rx="6" fill="#090d16" stroke="#1f2937" stroke-width="1" />
    <text x="32" y="228" font-family="ui-monospace, monospace" font-size="12" fill="#ffffff" font-weight="700">Health Score: <tspan fill="#10b981">94 / 100 (Grade A)</tspan></text>
    <text x="32" y="252" font-family="ui-monospace, monospace" font-size="11" fill="#38bdf8">Est. Cache Hit: 85% – 95%</text>
    <text x="32" y="274" font-family="ui-monospace, monospace" font-size="11" fill="#10b981">Token Waste Risk: Minimal (&lt; 5%)</text>
    <text x="32" y="296" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">Report: .agent-context-report.html</text>

    <!-- Auto launch line -->
    <text x="18" y="340" font-family="ui-monospace, monospace" font-size="11" fill="#38bdf8">🚀 Opening visual dashboard in browser...</text>
    <text x="18" y="365" font-family="ui-monospace, monospace" font-size="11" fill="#10b981">✨ Context audit finished!</text>
  </g>

  <!-- Right: Generated HTML Report Preview -->
  <g transform="translate(450, 24)">
    <rect x="0" y="0" width="406" height="392" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />

    <!-- Browser top bar -->
    <rect x="0" y="0" width="406" height="34" rx="10" fill="#1e293b" />
    <circle cx="16" cy="17" r="4" fill="#ef4444" />
    <circle cx="28" cy="17" r="4" fill="#f59e0b" />
    <circle cx="40" cy="17" r="4" fill="#10b981" />
    <text x="203" y="22" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">.agent-context-report.html</text>

    <!-- Score Bar inside Browser -->
    <g transform="translate(18, 50)">
      <rect x="0" y="0" width="370" height="74" rx="8" fill="#090d16" stroke="#10b981" stroke-width="1" />
      <text x="16" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700" fill="#6ee7b7">CONTEXT HEALTH SCORE</text>
      <text x="16" y="56" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="800" fill="#10b981">94<tspan font-size="14" fill="#64748b"> / 100</tspan></text>
      <rect x="270" y="24" width="84" height="26" rx="4" fill="#064e3b" />
      <text x="312" y="41" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">GRADE A</text>
    </g>

    <!-- 4 Pillar Mini Badges -->
    <g transform="translate(18, 140)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="370" height="46" rx="6" fill="#090d16" stroke="#1f2937" stroke-width="1" />
      <text x="14" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Pillar 1: Prefix Stability</text>
      <text x="14" y="38" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">CLAUDE.md &lt; 150 lines • Pre-commit active</text>
      <rect x="300" y="11" width="58" height="22" rx="4" fill="#064e3b" />
      <text x="329" y="26" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="800" fill="#34d399" text-anchor="middle">PASS</text>

      <!-- Item 2 -->
      <rect x="0" y="54" width="370" height="46" rx="6" fill="#090d16" stroke="#1f2937" stroke-width="1" />
      <text x="14" y="76" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Pillar 2: Native LSP &amp; Token Bombs</text>
      <text x="14" y="92" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">@vtsls ready • lockfile reads blocked</text>
      <rect x="300" y="65" width="58" height="22" rx="4" fill="#064e3b" />
      <text x="329" y="80" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="800" fill="#34d399" text-anchor="middle">PASS</text>

      <!-- Item 3 -->
      <rect x="0" y="108" width="370" height="46" rx="6" fill="#090d16" stroke="#1f2937" stroke-width="1" />
      <text x="14" y="130" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Pillar 3: Observation Masking</text>
      <text x="14" y="146" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">RTK rewrites active (~75% stdout collapsed)</text>
      <rect x="300" y="119" width="58" height="22" rx="4" fill="#064e3b" />
      <text x="329" y="134" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="800" fill="#34d399" text-anchor="middle">PASS</text>

      <!-- Item 4 -->
      <rect x="0" y="162" width="370" height="46" rx="6" fill="#090d16" stroke="#1f2937" stroke-width="1" />
      <text x="14" y="184" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Pillars 4 &amp; 5: Subagents &amp; Memory</text>
      <text x="14" y="200" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">10-call guardrail armed • PreCompact active</text>
      <rect x="300" y="173" width="58" height="22" rx="4" fill="#064e3b" />
      <text x="329" y="188" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="800" fill="#34d399" text-anchor="middle">PASS</text>
    </g>
  </g>
</svg>
