<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad1)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="180" fill="#3b82f6" opacity="0.12" filter="url(#glow1)" />
  <circle cx="1080" cy="450" r="220" fill="#06b6d4" opacity="0.1" filter="url(#glow1)" />
  <circle cx="640" cy="580" r="160" fill="#10b981" opacity="0.08" filter="url(#glow1)" />

  <!-- Grid overlay -->
  <path d="M0,80 H1280 M0,160 H1280 M0,240 H1280 M0,320 H1280 M0,400 H1280 M0,480 H1280 M0,560 H1280" stroke="#1e293b" stroke-width="1" opacity="0.25" />
  <path d="M160,0 V640 M320,0 V640 M480,0 V640 M640,0 V640 M800,0 V640 M960,0 V640 M1120,0 V640" stroke="#1e293b" stroke-width="1" opacity="0.25" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1280" height="5" fill="url(#glowGrad1)" />

  <!-- Top Badges -->
  <g transform="translate(80, 55)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#1e1b4b" stroke="#3730a3" stroke-width="1.5" />
    <text x="80" y="21" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle">CLAUDE CODE READY</text>

    <rect x="175" y="0" width="180" height="32" rx="16" fill="#064e3b" stroke="#059669" stroke-width="1.5" />
    <text x="265" y="21" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">100% LOCAL • ZERO TELEMETRY</text>

    <rect x="370" y="0" width="150" height="32" rx="16" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
    <text x="445" y="21" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#e5e7eb" text-anchor="middle">5-PILLAR HARNESS</text>
  </g>

  <!-- Main Headline & Subtitle -->
  <text x="80" y="150" font-family="-apple-system, system-ui, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    🛠️ Agent Context Forge
  </text>
  <text x="80" y="195" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
    The Context-Engineering Harness that Stops AI Coding Agents from Degrading
  </text>

  <!-- Left: Quick Terminal Card -->
  <g transform="translate(80, 240)">
    <!-- Terminal Window -->
    <rect x="0" y="0" width="520" height="330" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Title bar -->
    <rect x="0" y="0" width="520" height="40" rx="12" fill="#111827" />
    <circle cx="20" cy="20" r="6" fill="#ef4444" />
    <circle cx="38" cy="20" r="6" fill="#f59e0b" />
    <circle cx="56" cy="20" r="6" fill="#10b981" />
    <text x="260" y="25" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">terminal • zsh</text>

    <!-- Terminal Text -->
    <text x="24" y="80" font-family="ui-monospace, monospace" font-size="15" fill="#38bdf8" font-weight="600">$ npx agent-context-forge</text>
    <text x="24" y="115" font-family="ui-monospace, monospace" font-size="13" fill="#10b981">✓ Project detected: TypeScript / Node.js</text>
    <text x="24" y="145" font-family="ui-monospace, monospace" font-size="13" fill="#cbd5e1">✓ [Pillar 1] Prefix Stability: Frozen Tier-1 (&lt;150 lines)</text>
    <text x="24" y="175" font-family="ui-monospace, monospace" font-size="13" fill="#cbd5e1">✓ [Pillar 2] Progressive Disclosure: Native LSP Active</text>
    <text x="24" y="205" font-family="ui-monospace, monospace" font-size="13" fill="#cbd5e1">✓ [Pillar 3] Observation Masking: RTK Active (~75% savings)</text>
    <text x="24" y="235" font-family="ui-monospace, monospace" font-size="13" fill="#cbd5e1">✓ [Pillar 4] Subagent Isolation: 10-call Guardrail Wired</text>
    <text x="24" y="265" font-family="ui-monospace, monospace" font-size="13" fill="#cbd5e1">✓ [Pillar 5] Episodic Memory: Auto-Memory + PreCompact</text>

    <!-- Bottom Status Line -->
    <rect x="16" y="285" width="488" height="30" rx="6" fill="#064e3b" opacity="0.6" />
    <text x="260" y="305" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">⚡ CONTEXT HEALTH SCORE: 100/100 (GRADE A)</text>
  </g>

  <!-- Right: 2-Layer Foundation Architecture Card -->
  <g transform="translate(630, 240)">
    <rect x="0" y="0" width="570" height="330" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5" />

    <!-- Card Header -->
    <text x="30" y="45" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">
      THE 2-LAYER ARCHITECTURE
    </text>
    <text x="30" y="70" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#94a3b8">
      Harness vs. Methodology • Context Window = RAM | Repo = Disk
    </text>

    <!-- Layer 2 Box (Methodology) -->
    <g transform="translate(30, 95)">
      <rect x="0" y="0" width="510" height="85" rx="8" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.5" />
      <text x="20" y="28" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#818cf8">
        LAYER 2: Workflow &amp; Planning Methodology
      </text>
      <text x="20" y="52" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">
        Superpowers SDD • GetShitDone (GSD) • ECC • Elephant-Goldfish • TDD
      </text>
      <text x="20" y="72" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#94a3b8">
        "How you brainstorm, decompose features, and coordinate tasks."
      </text>
    </g>

    <!-- Connectors -->
    <text x="285" y="202" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#10b981" text-anchor="middle">
      ▲ ▲ ▲  FOUNDATION LAYER  ▲ ▲ ▲
    </text>

    <!-- Layer 1 Box (Harness) -->
    <g transform="translate(30, 215)">
      <rect x="0" y="0" width="510" height="95" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.5" />
      <text x="20" y="28" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#34d399">
        LAYER 1: The Context Engineering Harness (agent-context-forge)
      </text>
      <text x="20" y="52" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#f0fdf4">
        Frozen Prefix Cache • Native LSP • RTK Observation Masking • Subagent Gates
      </text>
      <text x="20" y="76" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#a7f3d0">
        "The invisible rails that keep working memory clean, cached, and token-lean."
      </text>
    </g>
  </g>
</svg>
